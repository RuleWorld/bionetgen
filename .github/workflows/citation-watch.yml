name: Citation watch (gh-pages)

# Thin wrapper -- keep this file stable; it should rarely need to change.
#
# This workflow must live on master because GitHub fires `schedule` only from
# the workflow file on the default branch. Everything it acts on, though, lives
# on gh-pages: _data/publications.yaml, _data/citation_seen.json, and
# scripts/citation_watch.py.
#
# All the actual logic is in scripts/citation_watch_ci.sh on gh-pages. Edit
# that, not this file. Steps used to be spelled out here as well as in a second
# copy of this workflow on gh-pages, and the two drifted: the 2026-09-01
# scheduled run died with ModuleNotFoundError for yaml because only the
# gh-pages copy had been given `pip install pyyaml`.

on:
  schedule:
    - cron: "0 13 1 * *"  # 13:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run citation watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/citation_watch_ci.sh
