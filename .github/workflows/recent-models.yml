name: Recent models page (gh-pages recent-models.md)

# Thin wrapper -- keep this file stable; it should rarely need to change.
# All the logic is in scripts/recent_models_ci.sh. Edit that, not this file.
#
# This workflow lives on gh-pages, not master (the opposite of
# citation-watch.yml): it triggers on pushes to gh-pages, and push events run
# the workflow file from the branch that was pushed, so a copy on master could
# never fire. One did exist there, drifted ahead of this file, and was deleted.
#
# No `schedule` trigger, since GitHub fires cron only from the default branch:
# this page only needs regenerating when _data/publications.yaml changes or on
# demand (e.g. after a new model is curated into RuleHub), both covered below.

on:
  push:
    branches: [gh-pages]
    paths: ["_data/publications.yaml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate recent-models.md
        run: bash scripts/recent_models_ci.sh
